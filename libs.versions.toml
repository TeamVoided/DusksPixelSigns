[versions]
    java = "25"
    kotlin = "2.3.0"
    fabric_loom = "1.19-SNAPSHOT"
    iridium = "4.0.0"
    # Dependencies
    minecraft = "26.2"
    fabric_loader = "0.20.1"
    fabric_api = "0.161.0+26.2"
    fabric_kotlin = "1.13.8+kotlin.2.3.0"
    fzzy_config = "0.7.7+26.2"
    tomlkt = "0.3.7"
    # Compatibility
    dusks_and_dungeons = "1.0.0-beta.9"
    enderscape = "g1hBr7BS"
    # Runtime
    modmenu = "17.0.1"
#    emi = "1.1.22+1.21.1"
    # Testing
#    creative_works = "0.7.0"
#    imguimc = "1.21.1-1.0.8"

[libraries]
    # Dependencies
    minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
    fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }
    fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }
    fabric_kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric_kotlin" }
    fzzy-config = { module = "me.fzzyhmstrs:fzzy_config", version.ref = "fzzy_config" }
    tomlkt = { module = "net.peanuuutz.tomlkt:tomlkt", version.ref = "tomlkt" }
    # Compatibility
    dusks_and_dungeons = { module = "org.teamvoided:dusks_and_dungeons", version.ref = "dusks_and_dungeons" }
    enderscape = { module = "maven.modrinth:btCrWvHr", version.ref = "enderscape" }
    # Runtime
    modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
#    emi = { module = "dev.emi:emi-fabric", version.ref = "emi" }
    # Testing
#    creative-works = { module = "org.teamvoided:creative_works", version.ref = "creative_works" }
#    imguimc = { module = "maven.modrinth:imgui-mc", version.ref = "imguimc" }

[plugins]
    kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
    fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric_loom" }
    iridium = { id = "org.teamvoided.iridium", version.ref = "iridium" }
    iridium-publish = { id = "iridium.project.publish-script", version.ref = "iridium" }
    iridium-upload = { id = "iridium.mod.upload-script", version.ref = "iridium" }

